[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = post:tools/package_firmware.py

; Bluetooth/NimBLE options are configured in sdkconfig.esp32dev.
; ESP32 WROOM uses UART0 rather than USB Serial/JTAG.
