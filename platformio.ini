[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; В menuconfig (idf.py menuconfig) включите:
; Component config → Bluetooth → NimBLE
; Component config → Bluetooth → NimBLE → Enable MTU configuration
; (для ESP32 WROOM USB Serial/JTAG не включаем — используем UART0)
build_flags =
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CONFIG_BT_NIMBLE_NVS_PERSIST=1

